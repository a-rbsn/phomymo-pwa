<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Print images to Phomemo thermal printers via Bluetooth">
  <title>Phomemo Print</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Phomemo Print</h1>
    </header>

    <!-- Connection -->
    <section class="card">
      <div class="connection-row">
        <button id="connect-btn" class="btn-primary">Connect to Printer</button>
        <button id="disconnect-btn" class="btn-disconnect hidden">Disconnect</button>
      </div>
      <div id="printer-info" class="printer-info hidden">
        <span class="dot"></span>
        <span id="printer-name"></span>
      </div>
      <div id="status" class="status"></div>
    </section>

    <!-- Preview + Upload -->
    <section class="card">
      <div id="preview-area" class="preview-area">
        <canvas id="preview-canvas" class="hidden"></canvas>
        <div id="preview-placeholder" class="preview-placeholder">Tap to load an image</div>
      </div>
      <div class="upload-row">
        <button id="camera-btn" class="btn-secondary">Camera</button>
        <button id="upload-btn" class="btn-secondary">Upload</button>
      </div>
      <input type="file" id="file-input" accept="image/*" class="hidden">
      <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
    </section>

    <!-- Image Controls -->
    <section class="card" id="controls">
      <div class="control-group">
        <label for="dither-mode">Dither Mode</label>
        <select id="dither-mode">
          <option value="floyd-steinberg" selected>Floyd-Steinberg</option>
          <option value="atkinson">Atkinson</option>
          <option value="ordered">Ordered (Bayer)</option>
          <option value="threshold">Threshold (no dither)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="brightness">Brightness <span id="brightness-value">0</span></label>
        <input type="range" id="brightness" min="-100" max="100" value="0">
      </div>
      <div class="control-group">
        <label for="contrast">Contrast <span id="contrast-value">0</span></label>
        <input type="range" id="contrast" min="-100" max="100" value="0">
      </div>
      <div class="control-group">
        <label for="density">Print Darkness <span id="density-value">6</span></label>
        <input type="range" id="density" min="1" max="8" value="6">
      </div>
    </section>

    <!-- Print -->
    <section class="card">
      <button id="print-btn" class="btn-primary btn-print" disabled>Print</button>
      <div id="progress" class="progress-section hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-text" class="progress-text"></div>
      </div>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
